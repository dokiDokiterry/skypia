<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Teresa">
  <meta name="color-scheme" content="light dark">

  <title>SKYPIA</title>

  <link rel="stylesheet" href="./assets/style/normal.css">
</head>

<body>

  <header>

    <div class="header-top">

      <h1>teresaarchive</h1>

      <button class="theme-toggle" type="button">
        <img
          src="assets/fotos/dans-dark.png"
          alt="Thema toggle"
        >
      </button>

    </div>

    <nav>
      <ul>

        <li>
          <a href="/readme.html">Readme</a>
        </li>

        <li>
          <a href="/links.html">Links</a>
        </li>

        <li>
          <a href="/aboutme.html">About me</a>
        </li>

      </ul>
    </nav>

  </header>


  <main>

    <section class="circle-gallery">

      <h2 class="visually-hidden">
        Neem een kijkje in mijn skypia
      </h2>

      <picture>

        <source
          id="dark-cd"
          srcset="assets/fotos/pinkcd.png"
          media="not all"
        >

        <img
          id="plaat"
          src="assets/fotos/plaat.png"
        >

      </picture>


      <!--
        Voor deze SVG-boog heb ik ChatGPT om uitleg gevraagd.
        De cijfers in de path-code zijn nodig om de vorm van de boog
        te bepalen. Ik heb de code daarna gebruikt en aangepast
        voor mijn eigen ontwerp.
      -->

      <div class="arc-text">

        <svg viewBox="0 0 100 100">

          <path
            id="boog"
            d="M -4 50 A 54 54 0 0 1 104 50"
            fill="none"
          ></path>

          <text>
            <textPath
              href="#boog"
              startOffset="50%"
              text-anchor="middle"
            >
              Neem een kijkje in mijn skypia
            </textPath>
          </text>

        </svg>

      </div>


      <div class="img-circle">

        <img
          src="assets/fotos/miso 1.jpeg"
          alt="Miso XG dans cover foto"
        >

        <img
          src="assets/fotos/danssfeer.jpeg"
          alt="Foto van cubaanse danseres"
        >

        <img
          src="assets/fotos/miso.jpeg"
          alt="Foto van Miso optreden bij Embassade festival in Den haag"
        >

        <img
          src="assets/fotos/drum.jpeg"
          alt="Foto van een Drummer"
        >

        <img
          src="assets/fotos/freebird.jpg"
          alt="Foto van een Vrijheids Vogel"
        >

        <img
          src="assets/fotos/miso 2.jpeg"
          alt="Foto van Miso Blush dans cover op de Dam"
        >

        <img
          src="assets/fotos/gnarly.jpg"
          alt="Miso Gnarly dans cover foto"
        >

        <img
          src="assets/fotos/cubavlag.jpeg"
          alt="Foto van de Cubaanse vlag"
        >

      </div>


      <button class="center-btn" type="button">
        Click me
      </button>

    </section>

  </main>


  <footer>
    <p>teresaarchive</p>
  </footer>


  <script src="assets/script/theme.js"></script>

</body>
</html>
