# Mijn achtergond

Door mijn Cubaanse achtergrond heb ik van jongs af aan veel meegekregen van muziek, ritme en dans. 
Als kind heb ik verschillende dansstijlen geprobeerd, waaronder hiphop, dance, afro en commercial. 
Vooral commercial vond ik erg leuk, omdat je daarin veel verschillende bewegingen en stijlen kunt combineren.

Dans is gewoon iets dat altijd bij mij heeft gepast!

<img class="babyteresa" src="../../afbeeldingen/babyteresa.jpeg" alt="baby teresa in Cuba"/>

class: , middle

# Mijn verschillende stijlen!
Deze dansstijlen heb ik gevolgd: 

- **Salsa**: 
Door mijn Cubaanse achtergrond heb ik ook veel met salsa meegekregen. 
Vooral het ritme en de manier van bewegen vind ik interessant.
- **Hiphop**: 
Veel bezig geweest met freestyle, ritme en krachtige bewegingen.
- **Dancehall**:
Verschillende choreografieën en bewegingen leren combineren.
- **Afro**: 
Veel focus op ritme, energie en verschillende soorten bewegingen.
- **Commercial**: 
Mijn favoriete stijl om verschillende dansstijlen en bewegingen te combineren.
- **Choreografie**: 
Ik vind het leuk om bewegingen samen te brengen met muziek en performance. 
Dit is uiteindelijk ook een grote link naar K-pop dance geworden.

---

class: center, middle

# Themisozone: K-pop dans cover groep

Rond mijn 15e/16e ben ik begonnen met K-pop cover dance. De combinatie van muziek, choreografie,
performance en de hele cultuur rondom K-pop sprak mij erg aan. Wat begon als gewoon een nieuwe dansstijl proberen, is uiteindelijk uitgegroeid tot een grote hobby. 

Inmiddels dans ik bij The Miso Zone, een K-pop covergroep based in Amsterdam, 
waarvan ik daar samen met een andere leader verantwoordelijk voor de groep!
We leren en oefenen samen choreografieën, maken covers en werken toe naar optredens en andere projecten.

Van verschillende dansstijlen uitproberen, naar mijn eigen K-pop dansgroep.


---

class: center, middle

# Waarom heb ik hier een passie voor?

Wat ik vooral leuk vind aan dans, is dat ik mezelf steeds kan blijven uitdagen en beter kan worden. 
Een choreografie leren kost soms veel tijd, maar juist het moment waarop alles uiteindelijk samenkomt vind ik heel leuk.

Door dans heb ik ook veel nieuwe mensen leren kennen en goede vriendschappen opgebouwd. 
Het geeft me een gevoel van vrijheid en een plek waar ik mezelf kan zijn.

Door de jaren heen is dans daardoor steeds meer dan alleen een hobby geworden. 
Het is echt een passie waar ik veel tijd en energie in stop.
