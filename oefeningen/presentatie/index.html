# Mijn achtergond

Door mijn Cubaanse achtergrond heb ik van jongs af aan veel meegekregen van muziek, ritme en dans. 
Als kind heb ik verschillende dansstijlen geprobeerd, waaronder hiphop, dance, afro en commercial. 
Vooral commercial vond ik erg leuk, omdat je daarin veel verschillende bewegingen en stijlen kunt combineren.

Dans is gewoon iets dat altijd bij mij heeft gepast!
