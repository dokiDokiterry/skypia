# Agenda


1. Onderwerp
2. 10 links
3. 50 afbeeldingen

# Onderwerp

Wat is jouw interesse, waarom, wat, hoe (cultuur, vakmanschap, sport, idool, ​hobby, passie categorie enz.) toon een hoeveelheid afbeeldingen.​
Dansen (Salsa, freestyle en choreo), Gamen (computer games), Cubaanse achtergond, Anime... Game of thrones.. series

# 10 links

Welke 10 links heb je gelezen, geraadpleegd ter inspiratie, verdieping? Wat heb je daaruit gehaald?

---

# Zoek 50 afbeeldingen

Waarom kies je specifiek voor deze verzameling? Zijn er patronen te ontdekken? Heeft
alles een specifieke kleurstelling? Herken je een actie, een gevoel, een materiaal of
een standpunt? Wat is kenmerkend voor deze verzameling? Welke dingen komen steeds terug?
